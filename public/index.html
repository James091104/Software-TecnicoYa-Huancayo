<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111922">
  <title>Aeon — Más allá de nuestro cielo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hero.css">
  <script src="hero.js" defer></script>
</head>
<body>
<main>
  <section class="hero" aria-labelledby="hero-title">
    <video class="hero-video" autoplay muted loop playsinline aria-hidden="true" tabindex="-1" src="media/nadiria-background.mp4"></video>
    <div class="hero-shade" aria-hidden="true"></div>
    <header class="header">
      <span class="monogram glass" aria-label="Aeon">a</span>
      <nav class="navigation glass" aria-label="Navegación principal">
        <button type="button">La experiencia</button>
        <span aria-hidden="true"></span>
        <button type="button">El universo</button>
      </nav>
      <button class="reserve glass" type="button">Reservar plaza <span aria-hidden="true">↗</span></button>
    </header>
    <div class="content">
      <div class="new glass reveal" style="--delay:.4s"><span aria-hidden="true">✦</span> Nuevo</div>
      <h1 id="hero-title" class="section-title" aria-label="Más allá de nuestro cielo, a través del universo"><span class="word" style="--delay:.45s">Más</span> <span class="word" style="--delay:.53s">allá</span> <span class="word" style="--delay:.61s">de</span> <span class="word" style="--delay:.69s">nuestro</span> <span class="word" style="--delay:.77s">cielo,</span> <span class="word" style="--delay:.85s">a</span> <span class="word" style="--delay:.93s">través</span> <span class="word" style="--delay:1.01s">del</span> <span class="word" style="--delay:1.09s">universo</span></h1>
      <p class="description reveal" style="--delay:1.1s">Una nueva perspectiva. Un viaje extraordinario.<br>El universo está más cerca de lo que imaginas.</p>
      <div class="actions reveal" style="--delay:1.2s">
        <button class="primary" type="button">Empezar el viaje <span aria-hidden="true">↗</span></button>
        <button class="glass secondary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg>Ver el despegue</button>
      </div>
      <div class="metrics reveal" style="--delay:1.3s">
        <article class="metric glass">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3M18 6l2-2"/></svg>
          <p class="figure">34, 5 <span>min</span></p>
          <p class="metric-label">Más allá de lo cotidiano</p>
        </article>
        <article class="metric glass">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="11" ry="3.5" transform="rotate(-35 12 12)"/></svg>
          <p class="figure">2, 8 B+</p>
          <p class="metric-label">Motivos para mirar arriba</p>
        </article>
      </div>
    </div>
    <footer class="partners reveal" style="--delay:1.4s" aria-label="Nuestros socios"><span>Aeon</span><span>Vela</span><span>Apex</span><span>Orbit</span><span>Zeno</span></footer>
  </section>
</main>
</body>
</html>
