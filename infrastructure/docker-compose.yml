services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tecnicoya
      POSTGRES_USER: tecnicoya
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes:
      - marketplace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecnicoya"]
      interval: 5s
      retries: 10
  matching:
    build: ../python/api
    environment:
      PORT: 8000
  api:
    build: ../backend/api
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set a Laravel APP_KEY in your environment}
      APP_DEBUG: "false"
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: tecnicoya
      DB_USER: tecnicoya
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHON_URL: http://matching:8000
      PORT: 3000
  web:
    build: ../frontend/web
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:3000
      PORT: 5173
volumes:
  marketplace-db:
